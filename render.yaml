services:
  - type: web
    name: refugio-da-ferradura
    runtime: node
    buildCommand: pnpm run render:build
    startCommand: pnpm run render:start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        generateValue: false
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: refugio-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: UPLOADS_DIR
        value: /opt/render/project/src/uploads

databases:
  - name: refugio-db
    databaseName: refugio_ferradura
    user: refugio_admin
    plan: free
