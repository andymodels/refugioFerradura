openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Refúgio da Ferradura API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: posts
    description: Unified content posts (articles, places, experiences)
  - name: media
    description: Media upload
  - name: auth
    description: Authentication
  - name: ai
    description: AI content generation
  - name: fontes
    description: Content sources for the automated publishing pipeline
  - name: partners
    description: Instagram profiles cited in blog posts, tracked for manual repost authorization
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: adminLogout
      tags: [auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current admin user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts:
    get:
      operationId: listPosts
      tags: [posts]
      summary: List all published posts
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"

  /posts/admin:
    get:
      operationId: listPostsAdmin
      tags: [posts]
      summary: List all posts for admin (includes drafts)
      responses:
        "200":
          description: List of posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"

  /posts/{slug}:
    get:
      operationId: getPost
      tags: [posts]
      summary: Get post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Post detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Post not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /posts/admin/{id}:
    get:
      operationId: getPostAdmin
      tags: [posts]
      summary: Get post by ID for admin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updatePost
      tags: [posts]
      summary: Update a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePostBody"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePost
      tags: [posts]
      summary: Delete a post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /posts/admin/create:
    post:
      operationId: createPost
      tags: [posts]
      summary: Create a new post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePostBody"
      responses:
        "201":
          description: Created post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"

  /posts/admin/reorder:
    post:
      operationId: reorderPosts
      tags: [posts]
      summary: Set the manual display order of posts (drag-and-drop in the admin list)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPostsBody"
      responses:
        "200":
          description: New order applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PostListResponse"

  /posts/admin/{id}/publish-instagram:
    post:
      operationId: publishPostInstagram
      tags: [posts]
      summary: Publish a post to the official Instagram feed (manual trigger only, never automatic)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published to Instagram
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          description: Post not eligible for publishing (not published, no cover image, or already posted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /fontes/admin:
    get:
      operationId: listFontes
      tags: [fontes]
      summary: List all content sources
      responses:
        "200":
          description: List of sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FonteListResponse"
    post:
      operationId: createFonte
      tags: [fontes]
      summary: Create a new content source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFonteBody"
      responses:
        "201":
          description: Created source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fonte"

  /fontes/admin/{id}:
    patch:
      operationId: updateFonte
      tags: [fontes]
      summary: Update a content source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFonteBody"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fonte"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFonte
      tags: [fontes]
      summary: Delete a content source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /partners/admin:
    get:
      operationId: listInstagramPartners
      tags: [partners]
      summary: List all discovered Instagram partner profiles
      responses:
        "200":
          description: List of partners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPartnerListResponse"
    post:
      operationId: createInstagramPartner
      tags: [partners]
      summary: Manually register a partner not found via the blog scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstagramPartnerBody"
      responses:
        "201":
          description: Created partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPartner"

  /partners/admin/scan:
    post:
      operationId: scanInstagramPartners
      tags: [partners]
      summary: Manually scan published posts for cited Instagram profiles (never automatic, never follows/downloads/publishes)
      responses:
        "200":
          description: Scan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScanInstagramPartnersResponse"

  /partners/admin/{id}:
    patch:
      operationId: updateInstagramPartner
      tags: [partners]
      summary: Update a partner profile (name, status, authorization record)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstagramPartnerBody"
      responses:
        "200":
          description: Updated partner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPartner"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/admin/content:
    get:
      operationId: listPartnerContentItems
      tags: [partners]
      summary: List all queued/scheduled/published partner content items
      responses:
        "200":
          description: List of content items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerContentItemListResponse"

  /partners/admin/{id}/content:
    post:
      operationId: createPartnerContentItem
      tags: [partners]
      summary: Queue a piece of already-uploaded media for a partner (partner must already be authorized for that content type)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePartnerContentItemBody"
      responses:
        "201":
          description: Queued content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerContentItem"
        "400":
          description: Partner not authorized for this content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/admin/content/{id}:
    patch:
      operationId: updatePartnerContentItem
      tags: [partners]
      summary: Update a queued content item (e.g. cancel it)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePartnerContentItemBody"
      responses:
        "200":
          description: Updated content item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerContentItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/admin/schedule-settings:
    get:
      operationId: getScheduleSettings
      tags: [partners]
      summary: Get the Stories auto-scheduling configuration
      responses:
        "200":
          description: Schedule settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSettingsResponse"
    patch:
      operationId: updateScheduleSettings
      tags: [partners]
      summary: Update the Stories auto-scheduling configuration (including the master automacaoAtiva kill switch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScheduleSettingsBody"
      responses:
        "200":
          description: Updated schedule settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSettingsResponse"

  /partners/admin/schedule-preview:
    get:
      operationId: getSchedulePreview
      tags: [partners]
      summary: Simulate the next 7 days of scheduled Stories — read-only, never publishes or persists anything
      responses:
        "200":
          description: Preview of the upcoming schedule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchedulePreviewResponse"

  /partners/admin/{id}/connect-link:
    post:
      operationId: createPartnerConnectLink
      tags: [partners]
      summary: Generate a one-time OAuth link for the partner to connect their own Instagram account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Connect link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectPartnerLinkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/admin/{id}/disconnect:
    post:
      operationId: disconnectPartner
      tags: [partners]
      summary: Disconnect a partner's connected Instagram account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Partner disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstagramPartner"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/admin/{id}/upload-link:
    post:
      operationId: createPartnerUploadLink
      tags: [partners]
      summary: Generate (or return the existing) public Story-upload link for the partner
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Upload link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerUploadLinkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/upload/{token}:
    get:
      operationId: getPartnerUploadInfo
      tags: [partners]
      summary: Public — get the partner name/status for the upload page (no login)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Partner info for the upload page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerUploadInfoResponse"
        "404":
          description: Link not found or not eligible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: submitPartnerUpload
      tags: [partners]
      summary: Public — partner submits a Story file directly to their own queue (no login)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "201":
          description: Uploaded and queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Not eligible or bad file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Link not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners/admin/content/{id}/publish-now:
    post:
      operationId: publishPartnerContentNow
      tags: [partners]
      summary: Manually publish one queued/scheduled content item right now (the only real-publish trigger — always explicit)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PartnerContentItem"
        "400":
          description: Failed to publish
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /media/upload:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload media file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        "200":
          description: Uploaded file info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaUploadResponse"

  /ai/generate-from-url:
    post:
      operationId: generateFromUrl
      tags: [ai]
      summary: Generate article from URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateFromUrlBody"
      responses:
        "200":
          description: Generated article
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedArticle"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: "#/components/schemas/AdminUser"
      required:
        - success
        - user

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
      required:
        - id
        - username

    Post:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        content:
          type: string
        coverImage:
          type: ["string", "null"]
        coverImageDisplayMode:
          type: string
          enum: [cover, natural]
          description: How the cover image is shown inside the article
        coverImagePosition:
          type: string
          description: CSS object-position for the cover image/video, e.g. "center top"
        gallery:
          type: ["string", "null"]
          description: JSON array of image URLs
        videoEmbeds:
          type: ["string", "null"]
          description: JSON array of video embed URLs
        tags:
          type: ["string", "null"]
          description: JSON array of tag strings
        status:
          type: string
        metaDescription:
          type: ["string", "null"]
        displayOrder:
          type: integer
          description: Manual position in listings, higher shows first
        pinnedUntil:
          type: ["string", "null"]
          format: date-time
          description: While in the future, this post is forced to the top of listings
        instagramPostedAt:
          type: ["string", "null"]
          format: date-time
          description: When this post was published to the official Instagram feed, if ever
        instagramMediaId:
          type: ["string", "null"]
          description: Instagram media ID returned when the post was published to Instagram
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - slug
        - content
        - status
        - createdAt
        - updatedAt

    PostListResponse:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: "#/components/schemas/Post"
        total:
          type: integer
      required:
        - posts
        - total

    CreatePostBody:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        content:
          type: string
        coverImage:
          type: ["string", "null"]
        coverImageDisplayMode:
          type: string
          enum: [cover, natural]
        coverImagePosition:
          type: string
        gallery:
          type: ["string", "null"]
        videoEmbeds:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
        status:
          type: string
        metaDescription:
          type: ["string", "null"]
      required:
        - title
        - slug
        - content
        - status

    UpdatePostBody:
      type: object
      properties:
        title:
          type: string
        subtitle:
          type: ["string", "null"]
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        content:
          type: string
        coverImage:
          type: ["string", "null"]
        coverImageDisplayMode:
          type: string
          enum: [cover, natural]
        coverImagePosition:
          type: string
        gallery:
          type: ["string", "null"]
        videoEmbeds:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
        status:
          type: string
        metaDescription:
          type: ["string", "null"]
        pinnedUntil:
          type: ["string", "null"]
          format: date-time
          description: While in the future, this post is forced to the top of listings. Send null to unpin.

    ReorderPostsBody:
      type: object
      properties:
        ids:
          type: array
          description: Post IDs in the desired order, top to bottom
          items:
            type: integer
      required:
        - ids

    Fonte:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        url:
          type: string
        tipo:
          type: string
        ativo:
          type: boolean
        ultimaVerificacao:
          type: ["string", "null"]
          format: date-time
        criadoEm:
          type: string
          format: date-time
        instagram:
          type: ["string", "null"]
        site:
          type: ["string", "null"]
        telefone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        endereco:
          type: ["string", "null"]
        tags:
          type: ["string", "null"]
      required:
        - id
        - nome
        - url
        - tipo
        - ativo
        - criadoEm

    FonteListResponse:
      type: object
      properties:
        fontes:
          type: array
          items:
            $ref: "#/components/schemas/Fonte"
        total:
          type: integer
      required:
        - fontes
        - total

    CreateFonteBody:
      type: object
      properties:
        nome:
          type: string
        url:
          type: string
        tipo:
          type: string
        ativo:
          type: boolean
        instagram:
          type: string
        site:
          type: string
        telefone:
          type: string
        email:
          type: string
        endereco:
          type: string
        tags:
          type: string
      required:
        - nome
        - url

    UpdateFonteBody:
      type: object
      properties:
        nome:
          type: string
        url:
          type: string
        tipo:
          type: string
        ativo:
          type: boolean
        instagram:
          type: string
        site:
          type: string
        telefone:
          type: string
        email:
          type: string
        endereco:
          type: string
        tags:
          type: string

    InstagramPartner:
      type: object
      properties:
        id:
          type: integer
        postId:
          type: ["integer", "null"]
        origem:
          type: string
          enum: [blog, manual]
        pausado:
          type: boolean
        nomeEstabelecimento:
          type: string
        instagramHandle:
          type: ["string", "null"]
        telefone:
