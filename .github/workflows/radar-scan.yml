name: Radar da Rota da Ferradura (diário 11h)

# Roda todo dia às 11h de Brasília (14h UTC, sem horário de verão no Brasil
# desde 2019). Só descobre e registra novidades (notícias regionais + posts
# públicos de parceiros) — nunca cria rascunho de post nem publica nada no
# Instagram.
# Pausado em 05/08/2026: não uso mais a geração automática de matérias via
# busca na web. O schedule foi desativado para evitar custo desnecessário de
# API. Mantido o workflow_dispatch para rodar manualmente se precisar.
on:
  # schedule:
  #   - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Cada chamada processa só um lote (a Cloudflare corta respostas com
      # mais de ~100s) — repete até a API dizer completo:true ou até 15
      # lotes, o que vier primeiro.
      - name: Rodar varredura do Radar (em lotes, até completar)
        run: |
          incluir_noticias=true
          for i in $(seq 1 15); do
            echo "Lote $i..."
            resposta=$(curl --fail --show-error --silent \
              --max-time 90 \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "https://refugioferradura.com.br/api/cron/radar-scan?incluirNoticias=${incluir_noticias}")
            echo "$resposta"
            incluir_noticias=false
            completo=$(echo "$resposta" | jq -r '.completo')
            if [ "$completo" = "true" ]; then
              echo "Varredura completa."
              exit 0
            fi
          done
          echo "Atingiu o limite de lotes desta execução — o resto continua na próxima."
