name: Radar da Rota da Ferradura (diário 11h)

# Roda todo dia às 11h de Brasília (14h UTC, sem horário de verão no Brasil
# desde 2019). Só descobre e registra novidades (notícias regionais + posts
# públicos de parceiros) — nunca cria rascunho de post nem publica nada no
# Instagram.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Rodar varredura do Radar
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/radar-scan
