name: Enfileirar um post manualmente (teste ou ajuste)

# Coloca UM item na fila do Instagram usando o segredo do servidor (que só o GitHub tem).
# Só roda se alguém clicar em "Run workflow". Usa a mesma rota /enqueue do motor do Mac,
# então o item passa pela mesma validação (imagens JPEG do nosso B2) e é publicado pelo
# vigia/tick quando o horário chegar. Serve para testar a cadeia de ponta a ponta.
on:
  workflow_dispatch:
    inputs:
      titulo:
        description: "Título interno do item (aparece no admin)"
        required: true
      minutos:
        description: "Publicar daqui a quantos minutos"
        required: true
        default: "10"
      legenda:
        description: "Corpo da legenda (o fechamento e as hashtags são acrescentados)"
        required: true
      imagens:
        description: "URLs do B2, separadas por espaço: 1 foto JPEG (foto única), 2 a 10 (carrossel) ou 1 vídeo .mp4 (Reel). Ignorado se video_origem estiver preenchido."
        required: false
        default: ""
      video_origem:
        description: "URL do vídeo no CDN do Instagram do parceiro (o servidor guarda no B2 e usa como Reel)"
        required: false
        default: ""
      nome_parceiro:
        description: "Nome curto do parceiro (só para nomear o arquivo guardado)"
        required: false
        default: "parceiro"
      post_id:
        description: "ID da matéria do blog a confirmar antes de publicar (opcional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  enfileirar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enfileirar
        env:
          TITULO: ${{ inputs.titulo }}
          MINUTOS: ${{ inputs.minutos }}
          LEGENDA: ${{ inputs.legenda }}
          IMAGENS: ${{ inputs.imagens }}
          VIDEO_ORIGEM: ${{ inputs.video_origem }}
          NOME_PARCEIRO: ${{ inputs.nome_parceiro }}
          POST_ID: ${{ inputs.post_id }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$VIDEO_ORIGEM" ]; then
            jq -n --arg url "$VIDEO_ORIGEM" --arg nome "$NOME_PARCEIRO" '{url:$url,tipo:"video",nome:$nome}' > arq.json
            codeA=$(curl --silent --max-time 280 -o respA.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json" \
              --data @arq.json https://refugioferradura.com.br/api/cron/instagram-queue/arquivar-midia || echo 000)
            echo "arquivar HTTP $codeA: $(head -c 300 respA.json)"
            [ "$codeA" = "201" ] || exit 1
            IMAGENS="$(jq -r .url respA.json)"
          fi
          QUANDO=$(date -u -d "+${MINUTOS} minutes" +%Y-%m-%dT%H:%M:%SZ)
          FECHO="Matéria completa no site Guia Refúgio Ferradura. Link na bio."
          TAGS="#RotaDaFerradura #BuenosAiresGuarapari #GuarapariES #TurismoCapixaba #EspiritoSanto"
          CAPTION="$(printf '%s\n\n%s\n\n%s' "$LEGENDA" "$FECHO" "$TAGS")"
          jq -n --arg titulo "$TITULO" --arg quando "$QUANDO" --arg caption "$CAPTION" --arg imgs "$IMAGENS" --arg post "$POST_ID" '
            {titulo:$titulo, scheduledAt:$quando, caption:$caption, imageUrls:($imgs|split(" ")|map(select(length>0))), pauta:"teste: ponta a ponta"}
            + (if $post != "" then {postId:($post|tonumber)} else {} end)' > body.json
          echo "Horário marcado (UTC): $QUANDO"
          code=$(curl --silent --max-time 120 -o resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" -H "Content-Type: application/json" \
            --data @body.json https://refugioferradura.com.br/api/cron/instagram-queue/enqueue || echo 000)
          echo "HTTP $code"; cat resp.json; echo
          [ "$code" = "201" ]
