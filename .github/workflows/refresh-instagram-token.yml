name: Renovar token do Instagram (dias 1 e 15)

# O token do Instagram oficial vence em ~60 dias. Duas vezes por mês este
# workflow pede à API para renová-lo (a Meta só renova token com mais de 24h e
# ainda válido) e o servidor guarda o novo. Se a renovação FALHAR, este
# workflow falha e o GitHub avisa por e-mail: é o alerta para gerar um token
# novo antes de o antigo vencer. Ver rota /api/cron/instagram-token/refresh.
on:
  schedule:
    - cron: "17 12 1,15 * *" # ~9h17 BRT dos dias 1 e 15
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Renovar token do Instagram
        run: |
          curl --fail --show-error --silent \
            --max-time 60 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/instagram-token/refresh
