name: Saúde da fila do Instagram (diário)

# Ideia trazida do blog UM2TRÊS (diagnóstico + aviso): a nuvem só publica o que o Mac
# deixou na fila, e quando o Mac para (cota do Claude Code, Mac desligado) tudo
# continuava "success" com a fila vazia (parou 27/10 e ninguém soube). Este job
# falha, e o GitHub avisa por e-mail, se a fila cobre menos de 2 dias à frente
# ou se algum item falhou nas últimas 72h. Também imprime o diagnóstico completo.
# Ver rota GET /api/cron/instagram-queue/status.
on:
  schedule:
    - cron: "17 11 * * *" # ~8h17 BRT
    - cron: "17 21 * * *" # ~18h17 BRT
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  saude:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir a fila
        run: |
          code=$(curl --silent --max-time 60 -o resp.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/instagram-queue/status || echo 000)
          echo "HTTP $code"
          cat resp.json; echo
          if [ "$code" = "200" ]; then
            echo "Fila saudável."
          elif [ "$code" = "503" ]; then
            echo "::error::Fila precisa de atenção: $(grep -o '"problemas":\[[^]]*\]' resp.json)"
            exit 1
          else
            echo "::error::Não foi possível ler a saúde da fila (HTTP $code)"
            exit 1
          fi
