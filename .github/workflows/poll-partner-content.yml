name: Descobrir, agendar e publicar conteúdo de parceiros (a cada 6h)

# Lê o feed/Reels de parceiros com conta conectada e enfileira o que for
# novo, aloca a fila nos horários configurados de quinta a domingo, e então
# publica no Instagram os itens agendados cujo horário já passou. Esse
# último passo só publica de fato se o interruptor "Ativar automação"
# estiver ligado em /admin/stories (storyScheduleSettingsTable.automacaoAtiva)
# — senão a rota não faz nada.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: poll-partner-content
  cancel-in-progress: false

jobs:
  poll-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Buscar conteúdo novo de parceiros conectados
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/poll-partner-content
      - name: Alocar fila nos horários configurados
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/assign-partner-schedule
      - name: Publicar itens agendados cujo horário já passou
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/publish-scheduled-partner-content
