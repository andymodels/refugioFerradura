name: Publicar próximo empreendimento (somente manual)

on:
  # A fila automática chama Claude para redigir e avaliar mídia. Mantemos
  # somente o disparo manual até existir um fluxo local aprovado.
  workflow_dispatch: {}

concurrency:
  group: publish-next-empreendimento
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar exatamente um item da fila
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/publish-next-empreendimento
