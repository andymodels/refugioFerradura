name: Publicar empreendimento da fila (3x/dia)

on:
  schedule:
    - cron: "0 10 * * *" # 7h BRT
    - cron: "0 15 * * *" # 12h BRT
    - cron: "0 22 * * *" # 19h BRT
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de publicação
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/publish-next-empreendimento
