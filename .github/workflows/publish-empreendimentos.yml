name: Publicar próximo empreendimento (1x/hora, 7h-19h BRT)

on:
  schedule:
    # 10h17–22h17 UTC = 7h17–19h17 no horário de Brasília.
    # Cada execução processa exatamente um item da fila.
    - cron: "17 10-22 * * *"
  workflow_dispatch: {}

concurrency:
  group: publish-next-empreendimento
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar exatamente um item da fila
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/publish-next-empreendimento
