name: Publicar empreendimento da fila (3x/dia)

on:
  schedule:
    # Minutos fora da hora cheia — GitHub recomenda evitar "0 * * * *" porque
    # é quando o agendador fica mais sobrecarregado e pode atrasar/pular.
    - cron: "7 10 * * *" # ~7h BRT
    - cron: "12 15 * * *" # ~12h BRT
    - cron: "9 22 * * *" # ~19h BRT
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de publicação
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/publish-next-empreendimento
