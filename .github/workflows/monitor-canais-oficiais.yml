name: Monitorar canais oficiais do Instagram (3x/dia)

on:
  # PAUSADO em 2026-07-27 após incidente de capa institucional duplicada na
  # reconciliação global — só reativar o `schedule` depois de revisão manual.
  # - schedule:
  #     - cron: "23 10 * * *" # ~7h BRT
  #     - cron: "28 15 * * *" # ~12h BRT
  #     - cron: "25 22 * * *" # ~19h BRT
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de monitoramento de canais oficiais
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/monitor-canais-oficiais
