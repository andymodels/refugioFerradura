name: Publicar matéria de busca regional (pausado — somente manual)

# Pausado enquanto a fila do diagnóstico é concluída. Mantemos o disparo
# manual para testes controlados, sem publicação automática concorrente.
on:
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de busca regional
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/publish-regional-search
