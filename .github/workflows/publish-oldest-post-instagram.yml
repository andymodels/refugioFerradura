name: Publicar post pendente no Instagram (7h e 19h)

# Duas vezes por dia, pega o post do blog mais antigo que já está publicado
# e ainda não foi postado no Instagram, e publica só esse — 1 por vez, pra
# esvaziar um acúmulo represado aos poucos em vez de postar tudo de uma vez.
# Sem revisão manual: se o post está publicado e tem mídia aprovada, vai
# direto. Ver rota /api/cron/publish-oldest-to-instagram.
on:
  schedule:
    - cron: "7 10 * * *" # ~7h BRT (UTC-3, sem horário de verão)
    - cron: "7 22 * * *" # ~19h BRT
  workflow_dispatch: {}

concurrency:
  group: publish-oldest-post-instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Publicar post mais antigo pendente no Instagram
        run: |
          curl --fail --show-error --silent \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://refugioferradura.com.br/api/cron/publish-oldest-to-instagram
